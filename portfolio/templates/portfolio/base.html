{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{{ page_title }}</title>

    <meta name="description" content="{{ page_description }}">
    <link rel="canonical" href="{{ canonical_url }}">
    <meta property="og:title" content="{{ page_title }}">
    <meta property="og:description" content="{{ page_description }}">
    <meta property="og:url" content="{{ canonical_url }}">
    <meta property="og:type" content="{{ og_type }}">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="{{ page_title }}">
    <meta name="twitter:description" content="{{ page_description }}">

    <link rel="stylesheet" href="{% static 'portfolio/site.css' %}">
</head>

<body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <header class="site-header">
        <div class="container header-inner">
            <a class="brand" href="/">Miguel Ribeiro</a>

            <nav class="site-nav" aria-label="Main navigation">
                <a href="/#projects">Projects</a>

                <a href="{% static 'portfolio/files/miguel-ribeiro-cv.pdf' %}" download>Download CV</a>

                <a
                    href="https://github.com/MiguelRibeiro-Cloud"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    GitHub
                </a>

                <a
                    href="https://www.linkedin.com/in/miguel-js-ribeiro/"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    LinkedIn
                </a>
            </nav>
        </div>
    </header>

    <main id="main-content" tabindex="-1">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>
                Built with Django and PostgreSQL as both a professional portfolio
                and a hands-on engineering laboratory.
            </p>
        </div>
    </footer>
    {% block scripts %}{% endblock %}
</body>
</html>
